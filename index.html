<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أرشفة</title>
<meta name="theme-color" content="#0f6e56">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أرشفة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ===================== نظام التصميم ===================== */
:root{
  --primary:#0f6e56; --primary-h:#0b5a46; --primary-bg:#e1f5ee; --on-primary:#fff;
  --bg:#f4f5f2; --card:#fff; --card-2:#f8f9f6; --text:#1d2320; --muted:#68706b; --border:#e2e5e0;
  --ok:#2f6410; --ok-bg:#eaf3de; --warn:#7a4708; --warn-bg:#faeeda; --bad:#a32d2d; --bad-bg:#fcebeb;
  --none:#5f5e5a; --none-bg:#efeee8;
  --radius:14px; --r-sm:10px; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --nav-h:64px;
}
:root[data-theme="dark"]{
  --primary:#3cc49a; --primary-h:#5dd3ad; --primary-bg:#0c3a2e; --on-primary:#06251c;
  --bg:#111413; --card:#1a1e1c; --card-2:#202523; --text:#e9ece9; --muted:#9aa29d; --border:#2c322f;
  --ok:#a8d77a; --ok-bg:#1f3312; --warn:#f2c06e; --warn-bg:#3a2a0e; --bad:#f29a9a; --bad-bg:#3d1717;
  --none:#c6c4bc; --none-bg:#2a2a27; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#3cc49a; --primary-h:#5dd3ad; --primary-bg:#0c3a2e; --on-primary:#06251c;
    --bg:#111413; --card:#1a1e1c; --card-2:#202523; --text:#e9ece9; --muted:#9aa29d; --border:#2c322f;
    --ok:#a8d77a; --ok-bg:#1f3312; --warn:#f2c06e; --warn-bg:#3a2a0e; --bad:#f29a9a; --bad-bg:#3d1717;
    --none:#c6c4bc; --none-bg:#2a2a27; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:16px;margin:0;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
[hidden]{display:none!important}

/* أزرار وحقول */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.6;pointer-events:none}
.danger-text{color:var(--bad)!important}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:0;background:transparent;color:var(--text);font-size:20px;cursor:pointer}
.icon-btn:hover{background:var(--card-2)}
label.field,div.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);min-height:44px;padding:8px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--primary)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;min-height:44px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.err{color:var(--bad);font-size:13px}

/* الهيكل */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.brand i{color:var(--primary);font-size:24px}
.topbar .sp{flex:1}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}
.nav{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;max-width:160px;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600;position:relative}
.nav a i{font-size:22px}
.nav a.on{color:var(--primary)}
.nav .dot{position:absolute;top:8px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* بطاقات وقوائم */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.section{margin-top:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.stat i{font-size:22px;color:var(--primary)}
.stat.bad i{color:var(--bad)} .stat.warn i{color:var(--warn)}
.stat b{font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--card-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{flex:none;border-radius:8px;background:var(--primary-bg);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad,.pill.miss{background:var(--bad-bg);color:var(--bad)} .pill.none,.pill.unknown{background:var(--none-bg);color:var(--none)}

/* فلاتر وبحث */
.filters{display:flex;flex-direction:column;gap:8px;position:sticky;top:61px;z-index:10;background:var(--bg);padding:4px 0 10px}
.search{position:relative;display:block}
.search i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.search input{padding-inline-start:38px}
.chips{display:flex;gap:8px;overflow-x:auto}
.chips select{width:auto;min-width:120px;flex:none}

/* ملف العامل */
.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile .avatar{cursor:zoom-in}
.profile-main{flex:1;min-width:180px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
@media (min-width:700px){.info{grid-template-columns:repeat(3,minmax(0,1fr))}}
.info div{background:var(--card-2);border-radius:var(--r-sm);padding:8px 12px;min-width:0}
.info small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.info span{display:block;overflow-wrap:anywhere}
.docs{display:flex;flex-direction:column;gap:10px}
.doc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.doc.old{opacity:.75}
.doc.missing{display:flex;align-items:center;justify-content:space-between;gap:8px;border-style:dashed;background:transparent}
.doc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.doc-title{display:flex;align-items:center;gap:8px;font-weight:700}
.doc-title i{color:var(--primary);font-size:20px}
.doc-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-top:6px}
.doc-meta b{color:var(--text);font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{width:72px;height:72px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-size:28px;color:var(--bad);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:2px;inset-inline-end:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.doc-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.tx{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--border)}
.tx:last-child{border-bottom:0}
.tx-main{flex:1;min-width:0}
.photo-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pick-btns{display:flex;gap:8px;flex-wrap:wrap}

/* نافذة منبثقة وتنبيهات */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal-back{align-items:center}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:640px){.modal{border-radius:18px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.lightbox{background:#000;max-width:none;width:auto;padding:0;border-radius:12px;display:flex;flex-direction:column}
.lightbox img{max-width:96vw;max-height:80vh;object-fit:contain;display:block}
.lightbox .lb-bar{display:flex;gap:8px;justify-content:center;padding:10px;background:#000}
.toasts{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));inset-inline:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:440px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty i{font-size:40px;color:var(--primary)}
.empty h3{color:var(--text);margin:8px 0 4px}
.skel{background:linear-gradient(90deg,var(--card-2),var(--border),var(--card-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--radius)}
@keyframes sk{to{background-position:-200% 0}}
.fab{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));inset-inline-end:16px;z-index:15;width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.type-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:12px 0;border-bottom:1px solid var(--border)}
.type-row:last-child{border-bottom:0}
.type-opts{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.type-opts select{width:auto}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth{width:100%;max-width:400px}
.auth .brand{justify-content:center;font-size:26px;margin-bottom:6px}
.auth .brand i{font-size:34px}
.inst{position:fixed;inset-inline:12px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:40;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 24px rgba(0,0,0,.15);padding:10px 12px;display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto}
.inst img{width:40px;height:40px;border-radius:10px;flex:none}
.inst.no-nav{bottom:calc(16px + env(safe-area-inset-bottom))}
.linkish{background:none;border:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;padding:8px 0;min-height:44px}
.form-sec{grid-column:1/-1;font-size:14px;font-weight:700;color:var(--primary);margin-top:8px;padding-top:12px;border-top:1px solid var(--border)}
.date-in{display:flex;gap:6px;align-items:center;position:relative}
.date-in #fb{flex:1;text-align:right}
.date-in .icon-btn{border:1px solid var(--border);border-radius:var(--r-sm);color:var(--primary);flex:none}
.date-in #fbPick{position:absolute;inset-inline-end:0;bottom:0;width:44px;height:1px;opacity:0;pointer-events:none;min-height:0;padding:0;border:0}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.seg label{flex:1;margin:0;cursor:pointer;position:relative}
.seg input{position:absolute;inset:0;width:1px;height:1px;min-height:0;padding:0;border:0;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;font-weight:600;color:var(--text)}
.seg input:checked + span{background:var(--primary);color:var(--on-primary)}
.seg input:focus-visible + span{outline:2px solid var(--primary);outline-offset:-2px}
.logo-prev{width:64px;height:64px;border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}

/* استمارة العامل للطباعة (A4) */
#printArea{display:none}
.pf{font-family:'Cairo',sans-serif;color:#000;background:#fff;width:190mm;margin:0 auto;padding:6mm 4mm;font-size:15px}
.pf-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.pf-ar{text-align:right;font-weight:700;font-size:17px;line-height:1.5}
.pf-en{text-align:left;font-weight:700;font-size:15px;line-height:1.4;direction:ltr}
.pf-logo{width:28mm;height:28mm;display:flex;align-items:center;justify-content:center}
.pf-logo img,.pf-logo svg{max-width:100%;max-height:100%;object-fit:contain}
.pf-rule{border:0;border-top:2px solid #000;margin:4mm 0 8mm}
.pf-body{display:flex;gap:10mm;align-items:flex-start}
.pf-fields{flex:1;display:flex;flex-direction:column;gap:5mm}
.pf-row{display:flex;align-items:flex-end;gap:6px}
.pf-row b{white-space:nowrap;font-weight:700}
.pf-row span{flex:1;border-bottom:1px dotted #000;min-height:1.5em;padding:0 4px}
.pf-photo{width:35mm;height:45mm;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:#666}
.pf-photo img{width:100%;height:100%;object-fit:cover}
.pf-notes{margin-top:10mm}
.pf-notes b{display:block;margin-bottom:3mm}
.pf-notes div{border-bottom:1px dotted #000;min-height:22mm;white-space:pre-wrap;padding:0 4px;line-height:2}
.pf-foot{margin-top:6mm;font-size:11px;color:#555;display:flex;justify-content:space-between}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  #root,.toasts,.modal-back{display:none!important}
  #printArea{display:block}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="printArea"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
/* =====================================================================
   1) الإعدادات — ضعي هنا رابط مشروع Supabase ومفتاح anon (العام فقط)
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://hvrewmomavnstredtqgm.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_4RNU9ZwZsZD9WnDZGwDOyQ_TN2gZFVG',
  TZ: 'Asia/Baghdad',
  WARN_DAYS: 30            // كم يوم قبل الانتهاء يصير التنبيه أصفر
};
const BUCKET = 'archive';
const IS_RECOVERY = /type=recovery/.test(location.hash);
const CONFIGURED = !CONFIG.SUPABASE_URL.includes('PUT_') && !CONFIG.SUPABASE_ANON_KEY.includes('PUT_');
const sb = CONFIGURED ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

/* =====================================================================
   2) الحالة والأدوات العامة
   ===================================================================== */
const S = { user:null, profile:null, types:[], workers:[], docs:[], settings:{}, loaded:false, info:null, urls:new Map() };
const F0 = { q:'', status:'active', wp:'', flag:'' };
S.f = { ...F0 };
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const ROLE_AR = { admin:'مدير النظام', editor:'محرّر', viewer:'مشاهد', pending:'بانتظار الموافقة' };
const STATUS_AR = { active:'فعّال', leave:'مجاز', left:'غادر' };
const APPLIES_AR = { all:'للكل', foreign:'للأجانب', local:'للعراقيين' };
const isEditor = () => ['admin','editor'].includes(S.profile?.role);
const isAdmin = () => S.profile?.role === 'admin';

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normDigits(s){ return String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function norm(s){ return normDigits(s).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim(); }
function val(el){ const v = normDigits(el?.value ?? '').trim(); return v === '' ? null : v; }
function todayStr(){ return new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function daysUntil(d){ if(!d) return null; return Math.round((Date.parse(d+'T00:00:00Z') - Date.parse(todayStr()+'T00:00:00Z')) / 86400000); }
function fmtDate(d){ if(!d) return '—'; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function fmtNum(n){ return (n == null || n === '') ? '—' : Number(n).toLocaleString('en-US'); }
// يقبل 15/3/1990 أو 15-03-1990 أو 1990-03-15 ويرجع بصيغة قاعدة البيانات
function parseDate(v){
  if(!v) return null; v = normDigits(v).trim().replace(/[.\-\s]+/g, '/');
  if(/^\d{8}$/.test(v)) v = `${v.slice(0,4)}/${v.slice(4,6)}/${v.slice(6)}`;
  let m = v.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/), y, mo, d;
  if(m){ [, y, mo, d] = m; } else { m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return null; [, d, mo, y] = m; }
  const iso = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`, t = new Date(iso + 'T00:00:00Z');
  return (!isNaN(t) && t.toISOString().slice(0,10) === iso && +y > 1900) ? iso : null;
}
// الجنسية غير العراقية = أجنبي (تحدد المستمسكات المطلوبة مثل الجواز والإقامة)
const isForeignNat = n => !!n && !/عراق/.test(n);
const fullName = w => [w.full_name, w.laqab].filter(Boolean).join(' ');
const EDU = ['أمي','يقرأ ويكتب','ابتدائية','متوسطة','إعدادية','دبلوم','بكالوريوس','ماجستير','دكتوراه'];
function initials(n){ const p = String(n||'').trim().split(/\s+/); return (p[0]?.[0]||'') + (p[1]?.[0]||''); }
function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }); }
function extOf(p){ const m = String(p).match(/\.([a-z0-9]+)$/i); return m ? m[1].toLowerCase() : 'bin'; }
function safeName(s){ return String(s).replace(/[\\/:*?"<>|]/g,'-').trim() || 'ملف'; }
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

function toast(msg, type='ok'){
  const t = document.createElement('div'); t.className = 'toast ' + (type==='bad'?'bad':''); t.textContent = msg;

function errMsg(e){
  console.error(e); const m = e?.message || String(e);
  if(/Invalid login/i.test(m)) return 'البريد أو كلمة المرور غير صحيحة';
  if(/row-level security|permission denied|not authorized/i.test(m)) return 'ما عندج صلاحية لهذا الإجراء';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'ما كدرنا نتصل، تأكدي من الإنترنت وحاولي مرة ثانية';
  if(/maximum allowed size|too large/i.test(m)) return 'حجم الملف كبير (الحد 15MB)';
  if(/foreign key/i.test(m)) return 'ما ينحذف لأن مرتبط بمستمسكات مرفوعة';
  if(/duplicate key|unique/i.test(m)) return 'هذا الاسم موجود من قبل';
  return 'صار خطأ: ' + m;
}
async function busy(btn, fn){

async function fetchAll(build){
  const size = 1000; let from = 0, all = [];
  for(;;){ const { data, error } = await build().range(from, from+size-1); if(error) throw error; all = all.concat(data); if(data.length < size) break; from += size; }
  return all;
}
async function loadAll(){
  const [types, workers] = await Promise.all([
    fetchAll(() => sb.from('document_types').select('*').order('sort').order('id')),
    fetchAll(() => sb.from('workers').select('*').order('full_name'))
  ]);
  S.types = types; S.workers = workers;
  const st = await sb.from('app_settings').select('key,value');
  S.settings = Object.fromEntries((st.data || []).map(r => [r.key, r.value]));
  S.pending = 0;
  if(isAdmin()){ const pc = await sb.from('profiles').select('id', { count:'exact', head:true }).eq('role', 'pending'); S.pending = pc.count || 0; }
  S.docs = isEditor() ? await fetchAll(() => sb.from('worker_documents').select('id,worker_id,type_id,doc_number,issue_date,expiry_date,files,notes,created_at').order('created_at')) : [];
  S.info = null; S.loaded = true; updateNavDot();
}
async function signedUrls(paths){
  paths = [...new Set(paths.filter(Boolean))];
  const need = paths.filter(p => !(S.urls.get(p)?.exp > Date.now()));
  if(need.length){
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
    if(!error) data.forEach(d => { if(d.signedUrl) S.urls.set(d.path, { url:d.signedUrl, exp:Date.now()+55*60000 }); });
  }
  const out = {}; paths.forEach(p => { if(S.urls.get(p)) out[p] = S.urls.get(p).url; }); return out;
}
async function uploadBlob(path, blob, mime){
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:mime, upsert:true });
  if(error) throw error;
}
async function removeFiles(paths){ paths = paths.filter(Boolean); if(paths.length) await sb.storage.from(BUCKET).remove(paths); }

// تصغير الصور قبل الرفع (أسرع وأوفر بالمساحة) — ملفات PDF ترفع كما هي
async function prepareFile(file){
  const raw = { blob:file, mime:file.type || 'application/octet-stream', ext:extOf(file.name) };
  if(!file.type.startsWith('image/') || file.type === 'image/gif') return raw;
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return blob ? { blob, mime:'image/jpeg', ext:'jpg' } : raw;
  }catch(e){ return raw; }
}

   4) حساب حالة المستمسكات والنواقص
   ===================================================================== */
const typeById = id => S.types.find(t => t.id === id);
const typeApplies = (t, w) => t.applies_to === 'all' || (t.applies_to === 'foreign') === !!w.is_foreign;
function docState(d){
  const t = typeById(d.type_id);
  if(t && !t.has_expiry) return { k:'none', label:'بدون انتهاء' };
  if(!d.expiry_date) return { k:'unknown', label:'بدون تاريخ' };
  const n = daysUntil(d.expiry_date);
  if(n < 0) return { k:'bad', label:`منتهي من ${-n} يوم`, n };
  if(n <= CONFIG.WARN_DAYS) return { k:'warn', label: n === 0 ? 'ينتهي اليوم' : `باقي ${n} يوم`, n };
  return { k:'ok', label:'ساري', n };
}
function latestByType(docs){
  const L = {};
  docs.forEach(d => { const c = L[d.type_id]; const a = d.expiry_date||'', b = c?.expiry_date||'';
    if(!c || a > b || (a === b && d.created_at > c.created_at)) L[d.type_id] = d; });
  return L;
}
function infoOf(w){
  if(!S.info){
    const by = {}; S.docs.forEach(d => (by[d.worker_id] ||= []).push(d));
    S.info = new Map();
    S.workers.forEach(x => {
      const docs = by[x.id] || [], latest = latestByType(docs);
      const missing = S.types.filter(t => t.required && typeApplies(t, x) && !latest[t.id]);
      let expired = 0, warn = 0;
      Object.values(latest).forEach(d => { const k = docState(d).k; if(k==='bad') expired++; else if(k==='warn') warn++; });
      S.info.set(x.id, { docs, latest, missing, expired, warn });
    });
  }
  return S.info.get(w.id) || { docs:[], latest:{}, missing:[], expired:0, warn:0 };
}
function alertItems(range){
  const out = [];
  S.workers.filter(w => w.status !== 'left').forEach(w => {
    Object.values(infoOf(w).latest).forEach(d => { const st = docState(d); if((st.k==='bad'||st.k==='warn'||(st.n!=null && st.n<=range))) out.push({ w, d, st }); });
  });
  return out.sort((a,b) => (a.d.expiry_date||'').localeCompare(b.d.expiry_date||''));
}

function avatar(w, size=44, zoom=false){

async function hydrate(root){

    html += `<div class="stats">${stat('ti-users','عامل فعّال',active.length,'','')}${hasExp ? stat('ti-alert-octagon','عندهم مستمسك منتهي',exp,'expired','bad') + stat('ti-clock-exclamation','قريب الانتهاء خلال '+CONFIG.WARN_DAYS+' يوم',warn,'soon','warn') : ''}${stat('ti-file-alert','عندهم نواقص',miss,'missing','bad')}</div>`;
    const soon = alertItems(CONFIG.WARN_DAYS).slice(0, 6);
    if(hasExp) html += `<div class="section"><div class="section-head"><h2>أقرب المستمسكات انتهاءً</h2><a class="btn sm ghost" href="#/alerts">الكل</a></div>
      ${soon.length ? `<div class="list">${soon.map(alertRow).join('')}</div>` : `<div class="card">${emptyState('ti-circle-check','كلشي سليم','ماكو مستمسكات منتهية أو قريبة الانتهاء.')}</div>`}</div>`;
    html += `<div class="section"><div class="section-head"><h2>إجراءات سريعة</h2></div><div class="pick-btns">
      <a class="btn primary" href="#/worker/new"><i class="ti ti-user-plus"></i> إضافة عامل</a>
      <button class="btn" id="xAll"><i class="ti ti-file-spreadsheet"></i> تصدير Excel</button></div></div>`;
  } else {
    html += `<div class="stats"><a class="stat" href="#/workers"><i class="ti ti-users"></i><b>${active.length}</b><span>عامل فعّال</span></a></div>`;
  }
  app.innerHTML = html;
  $$('[data-flag]', app).forEach(a => a.onclick = () => { S.f = { ...F0, flag:a.dataset.flag }; });
  if($('#xAll')) $('#xAll').onclick = exportWorkers;
  hydrate(app);
}
function alertRow({ w, d, st }){
  return `<a class="row" href="#/worker/${w.id}">${avatar(w)}<span class="row-main"><b>${esc(fullName(w))}</b><small>${esc(typeById(d.type_id)?.name||'')} · ${fmtDate(d.expiry_date)}</small></span>${pill(st)}</a>`;
}

/* =====================================================================
   9) قائمة العمال
   ===================================================================== */
function pageWorkers(){
  const app = $('#app');
  const wps = [...new Set(S.workers.map(w => w.department).filter(Boolean))].sort();
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`;
  app.innerHTML = `<div class="page-head"><h1>العمال</h1>${isEditor()?'<button class="btn sm" id="xL"><i class="ti ti-file-spreadsheet"></i> تصدير Excel</button>':''}</div>
  <div class="filters"><label class="search"><i class="ti ti-search"></i><input id="q" type="search" placeholder="ابحثي بالاسم أو الهاتف${isEditor()?' أو رقم المستمسك':''}" value="${esc(S.f.q)}" aria-label="بحث"></label>
  <div class="chips">
    <select id="fs" aria-label="الحالة">${opt('','كل الحالات',S.f.status)}${opt('active','فعّال',S.f.status)}${opt('leave','مجاز',S.f.status)}${opt('left','غادر',S.f.status)}</select>
    <select id="fw" aria-label="القسم">${opt('','كل الأقسام',S.f.wp)}${wps.map(w => opt(w,w,S.f.wp)).join('')}</select>
    ${isEditor()?`<select id="ff" aria-label="فلتر">${opt('','كل العمال',S.f.flag)}${opt('expired','عنده منتهي',S.f.flag)}${opt('soon','قريب الانتهاء',S.f.flag)}${opt('missing','عنده نواقص',S.f.flag)}${opt('nophoto','بدون صورة',S.f.flag)}</select>`:''}
  </div></div>
  <p class="muted small" id="cnt" style="margin:0 0 8px"></p><div id="lst"></div>
  ${isEditor()?'<a class="fab" href="#/worker/new" aria-label="إضافة عامل"><i class="ti ti-plus"></i></a>':''}`;
  let t; $('#q').oninput = e => { clearTimeout(t); t = setTimeout(() => { S.f.q = e.target.value; renderWorkerList(); }, 200); };
  $('#fs').onchange = e => { S.f.status = e.target.value; renderWorkerList(); };
  $('#fw').onchange = e => { S.f.wp = e.target.value; renderWorkerList(); };
  if($('#ff')) $('#ff').onchange = e => { S.f.flag = e.target.value; renderWorkerList(); };
  if($('#xL')) $('#xL').onclick = () => exportWorkers(S.lastList);
  renderWorkerList();
}
function renderWorkerList(){
  const q = norm(S.f.q);
  const list = S.workers.filter(w => {
    if(S.f.status && w.status !== S.f.status) return false;
    if(S.f.wp && w.department !== S.f.wp) return false;
    const i = isEditor() ? infoOf(w) : null;
    if(S.f.flag === 'expired' && !i?.expired) return false;
    if(S.f.flag === 'soon' && !i?.warn) return false;
    if(S.f.flag === 'missing' && !i?.missing.length) return false;
    if(S.f.flag === 'nophoto' && w.photo_path) return false;
    if(q){
      const hay = norm([w.full_name, w.laqab, w.national_id, w.nationality, w.job_title, w.department, w.address, ...(i ? i.docs.map(d => d.doc_number) : [])].join(' '));
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  S.lastList = list;
  $('#cnt').textContent = `${list.length} عامل`;
  const box = $('#lst');
  if(!S.workers.length){ box.innerHTML = `<div class="card">${emptyState('ti-users-plus','ابدئي بأول عامل','ضيفي العامل بصورته ومعلوماته، وبعدين ارفعي مستمسكاته.', isEditor()?'<a class="btn primary" href="#/worker/new"><i class="ti ti-user-plus"></i> إضافة عامل</a>':'')}</div>`; return; }
  if(!list.length){ box.innerHTML = `<div class="card">${emptyState('ti-search-off','ماكو نتائج','جربي كلمة ثانية أو غيّري الفلاتر.')}</div>`; return; }
  box.innerHTML = `<div class="list">${list.map(workerRow).join('')}</div>`;
  hydrate(box);
}
function workerRow(w){
  const sub = [w.job_title, w.department].filter(Boolean).join(' · ') || w.nationality || '';
  let badge = '';
  if(w.status !== 'active') badge = pill({ k:'none', label:STATUS_AR[w.status] });
  else if(isEditor()){ const i = infoOf(w);
    badge = i.expired ? pill({k:'bad',label:'منتهي'}) : i.warn ? pill({k:'warn',label:'قريب الانتهاء'}) : i.missing.length ? pill({k:'miss',label:`ناقص ${i.missing.length}`}) : pill({k:'ok',label:'مكتمل'}); }
  return `<a class="row" href="#/worker/${w.id}">${avatar(w)}<span class="row-main"><b>${esc(fullName(w))}</b><small>${esc(sub)}</small></span>${badge}</a>`;
}

/* =====================================================================
   10) ملف العامل
   ===================================================================== */
async function pageWorker(id){
  const app = $('#app');
  const { data:w, error } = await sb.from('workers').select('*').eq('id', id).maybeSingle();
  if(error) throw error;
  if(!w){ app.innerHTML = emptyState('ti-user-off','العامل غير موجود','يمكن انحذف من النظام.','<a class="btn" href="#/workers">رجوع للقائمة</a>'); return; }
  let docs = [], txs = [];
  if(isEditor()){
    const [d, t] = await Promise.all([
      sb.from('worker_documents').select('*').eq('worker_id', id),
      sb.from('worker_transactions').select('*').eq('worker_id', id).order('tx_date', { ascending:false })
    ]);
    if(d.error) throw d.error; if(t.error) throw t.error; docs = d.data; txs = t.data;
  }
  const latest = latestByType(docs);
  const missing = S.types.filter(t => t.required && typeApplies(t, w) && !latest[t.id]);
  const sorted = [...docs].sort((a,b) => { const ta = typeById(a.type_id)?.sort ?? 999, tb = typeById(b.type_id)?.sort ?? 999; return ta - tb || (b.expiry_date||'').localeCompare(a.expiry_date||''); });
  const info = (l, v, ltr) => `<div><small>${l}</small><span ${ltr?'dir="ltr" style="text-align:right"':''}>${esc(v || '—')}</span></div>`;
  const st = { active:'ok', leave:'warn', left:'none' }[w.status];

  app.innerHTML = `<a class="btn sm ghost" href="#/workers"><i class="ti ti-arrow-right"></i> العمال</a>
  <div class="card" style="margin-top:8px">
    <div class="profile"><div class="profile-main"><h1>${esc(fullName(w))}</h1>
      <p class="muted" style="margin:2px 0 6px">${esc([w.job_title, w.department].filter(Boolean).join(' · ') || '—')}</p>
      ${pill({ k:st, label:STATUS_AR[w.status] })} ${w.is_foreign ? pill({k:'none',label:'أجنبي'}) : ''}</div>${avatar(w, 96, true)}</div>
    ${isEditor() ? `<div class="info">${info('الاسم', w.full_name)}${info('اللقب', w.laqab)}${info('رقم البطاقة الوطنية', w.national_id, 1)}${info('عنوان السكن', w.address)}${info('التحصيل الدراسي', w.education)}${info('العنوان الوظيفي', w.job_title)}</div>
    <p class="muted small" style="margin:14px 0 0;font-weight:600">معلومات إضافية</p>` : ''}
    <div class="info" style="margin-top:8px">${info('الجنسية', w.nationality)}${info('تاريخ الميلاد', w.birth_date && fmtDate(w.birth_date))}${info('القسم', w.department)}</div>
    ${w.notes ? `<p class="muted small" style="margin:14px 0 0;font-weight:600">الملاحظات</p><p style="margin:2px 0 0;white-space:pre-wrap">${esc(w.notes)}</p>` : ''}
    <div class="profile-actions">
      ${isEditor()?`<a class="btn" href="#/worker/${w.id}/edit"><i class="ti ti-edit"></i> تعديل</a>`:''}
      ${isEditor()?`<button class="btn" id="prW"><i class="ti ti-printer"></i> طباعة الاستمارة</button>`:''}
      ${isEditor()?`<button class="btn" id="dlAll"><i class="ti ti-download"></i> تحميل كل المستمسكات</button>`:''}
    </div>
  </div>
  ${isEditor() ? `
  <div class="section"><div class="section-head"><h2>المستمسكات</h2><button class="btn sm primary" id="addDoc"><i class="ti ti-upload"></i> رفع مستمسك</button></div>
    <div class="docs">
      ${missing.map(t => `<div class="doc missing"><span class="doc-title"><i class="ti ti-file-alert" style="color:var(--bad)"></i>${esc(t.name)} <span class="pill miss">ناقص</span></span><button class="btn sm" data-add-type="${t.id}"><i class="ti ti-upload"></i> رفع</button></div>`).join('')}
      ${sorted.map(d => docCard(d, latest[d.type_id]?.id === d.id)).join('')}
      ${!docs.length && !missing.length ? `<div class="card">${emptyState('ti-folder-open','ماكو مستمسكات بعد','ارفعي جوازه أو هويته أو عقده، وكلها تنحفظ هنا.')}</div>` : ''}
    </div></div>
  <div class="section"><div class="section-head"><h2>المعاملات</h2><button class="btn sm" id="addTx"><i class="ti ti-plus"></i> إضافة معاملة</button></div>
    ${txs.length ? `<div class="list">${txs.map(t => `<div class="tx"><i class="ti ti-receipt" style="font-size:20px;color:var(--primary);margin-top:2px"></i><div class="tx-main"><b>${esc(t.title)}</b><div class="muted small">${fmtDate(t.tx_date)}${t.cost!=null?` · الكلفة: ${fmtNum(t.cost)}`:''}</div>${t.notes?`<div class="small" style="white-space:pre-wrap">${esc(t.notes)}</div>`:''}</div><button class="icon-btn" data-del-tx="${t.id}" aria-label="حذف المعاملة"><i class="ti ti-trash"></i></button></div>`).join('')}</div>`
      : `<div class="card"><p class="muted" style="margin:0">ماكو معاملات مسجلة، مثل تجديد إقامة أو فيزا.</p></div>`}
  </div>` : ''}
  ${isAdmin() ? `<div class="section" style="text-align:center"><button class="btn ghost danger-text" id="delW"><i class="ti ti-trash"></i> حذف العامل وكل ملفاته</button></div>` : ''}`;

  hydrate(app);
  if(!isEditor()) return;
  const reload = () => pageWorker(id).then(() => loadAll());
  $('#addDoc').onclick = () => docModal(w, null, null, reload);
  $$('[data-add-type]', app).forEach(b => b.onclick = () => docModal(w, null, +b.dataset.addType, reload));
  $$('[data-edit-doc]', app).forEach(b => b.onclick = () => docModal(w, docs.find(d => d.id === b.dataset.editDoc), null, reload));
  $$('[data-del-doc]', app).forEach(b => b.onclick = async () => {
    const d = docs.find(x => x.id === b.dataset.delDoc);
    if(!await confirmBox(`تحذفين ${typeById(d.type_id)?.name || 'المستمسك'} مع ملفاته؟`)) return;
    await busy(b, async () => { const { error } = await sb.from('worker_documents').delete().eq('id', d.id); if(error) throw error;
      await removeFiles((d.files||[]).map(f => f.path)); toast('انحذف المستمسك'); await reload(); });
  });
  $('#addTx').onclick = () => txModal(w, reload);
  $$('[data-del-tx]', app).forEach(b => b.onclick = async () => {
    if(!await confirmBox('تحذفين هذي المعاملة؟')) return;
    await busy(b, async () => { const { error } = await sb.from('worker_transactions').delete().eq('id', b.dataset.delTx); if(error) throw error; toast('انحذفت المعاملة'); await reload(); });
  });
  $('#dlAll').onclick = e => busy(e.currentTarget, () => downloadAll(w, docs));
  $('#prW').onclick = e => busy(e.currentTarget, () => printForm(w));
  if($('#delW')) $('#delW').onclick = async e => {
    const btn = e.currentTarget;
    if(!await confirmBox(`تحذفين ${w.full_name} وكل صوره ومستمسكاته نهائياً؟ ما يرجع بعدين.`, 'حذف نهائي')) return;
    await busy(btn, async () => {
      const paths = [w.photo_path, ...docs.flatMap(d => (d.files||[]).map(f => f.path))];
      const { error } = await sb.from('workers').delete().eq('id', w.id); if(error) throw error;
      await removeFiles(paths); await loadAll(); toast('انحذف العامل'); location.hash = '#/workers';
    });
  };
}
function docCard(d, isLatest){
  const t = typeById(d.type_id) || { name:'مستمسك', has_expiry:true };
  const st = isLatest ? docState(d) : { k:'none', label:'نسخة سابقة' };
  const files = d.files || [];
  return `<div class="doc ${isLatest?'':'old'}"><div class="doc-head"><span class="doc-title"><i class="ti ti-file-text"></i>${esc(t.name)}</span>${pill(st)}</div>
  <div class="doc-meta">${d.doc_number?`<span>الرقم: <b dir="ltr">${esc(d.doc_number)}</b></span>`:''}${d.issue_date?`<span>الإصدار: <b>${fmtDate(d.issue_date)}</b></span>`:''}${t.has_expiry?`<span>الانتهاء: <b>${fmtDate(d.expiry_date)}</b></span>`:''}</div>
  ${d.notes?`<p class="small" style="margin:6px 0 0;white-space:pre-wrap">${esc(d.notes)}</p>`:''}
  <div class="thumbs">${files.length ? files.map(fileThumb).join('') : '<span class="muted small">بدون ملفات</span>'}</div>
  <div class="doc-actions"><button class="btn sm" data-edit-doc="${d.id}"><i class="ti ti-edit"></i> تعديل</button><button class="btn sm ghost danger-text" data-del-doc="${d.id}"><i class="ti ti-trash"></i> حذف</button></div></div>`;
}
function fileThumb(f){
  const img = (f.mime||'').startsWith('image/');
  return `<a class="thumb" data-file="${esc(f.path)}" data-img="${img?1:0}" target="_blank" rel="noopener" aria-label="${esc(f.name||'ملف')}">${img?'<img alt="">':'<i class="ti ti-file-type-pdf"></i>'}</a>`;
}

const orgAr = () => S.settings.org_name_ar ?? 'أبراج الأهرام';
const orgEn = () => S.settings.org_name_en ?? 'ABRAJ ALAHRAM';
async function logoHtml(){
  const p = S.settings.logo_path;
  if(p){ const u = (await signedUrls([p]))[p]; if(u) return `<img src="${esc(u)}" alt="">`; }
  return `<img src="${DEFAULT_LOGO}" alt="">`;
}
const waitImgs = el => Promise.all($$('img', el).map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
async function printForm(w){
  const pa = $('#printArea');
  const photo = w.photo_path ? (await signedUrls([w.photo_path]))[w.photo_path] : null;
  const row = (l, v) => `<div class="pf-row"><b>${l} :</b><span>${esc(v || '')}</span></div>`;
  pa.innerHTML = `<div class="pf">
    <div class="pf-head"><div class="pf-ar">${esc(orgAr())}</div><div class="pf-logo">${await logoHtml()}</div><div class="pf-en">${esc(orgEn())}</div></div>
    <hr class="pf-rule">
    <div class="pf-body"><div class="pf-fields">
      ${row('الاسم', w.full_name)}${row('اللقب', w.laqab)}${row('رقم البطاقة الوطنية', w.national_id)}${row('عنوان السكن', w.address)}
      ${row('التحصيل الدراسي', w.education)}${row('العنوان الوظيفي', w.job_title)}
    </div><div class="pf-photo">${photo ? `<img src="${esc(photo)}" alt="">` : 'صورة'}</div></div>
    <div class="pf-notes"><b>الملاحظات :</b><div>${esc(w.notes || '')}</div></div>
    <div class="pf-foot"><span>تاريخ الطباعة: ${fmtDate(todayStr())}</span></div></div>`;
  await Promise.race([waitImgs(pa), new Promise(r => setTimeout(r, 6000))]);
  window.print();
}

// تحميل كل ملفات العامل بملف مضغوط واحد
async function downloadAll(w, docs){
  const files = [];
  if(w.photo_path) files.push({ path:w.photo_path, name:'الصورة الشخصية' });
  const count = {};
  [...docs].sort((a,b) => (typeById(a.type_id)?.sort??999) - (typeById(b.type_id)?.sort??999)).forEach(d => {
    const tn = typeById(d.type_id)?.name || 'مستمسك';
    (d.files||[]).forEach(f => { count[tn] = (count[tn]||0) + 1; files.push({ path:f.path, name: count[tn] > 1 ? `${tn} (${count[tn]})` : tn }); });
  });
  if(!files.length){ toast('ماكو ملفات مرفوعة لهذا العامل', 'bad'); return; }
  toast('جاري تجهيز الملفات...');
  const zip = new JSZip(); let ok = 0;
  for(const f of files){ const { data, error } = await sb.storage.from(BUCKET).download(f.path); if(!error){ zip.file(`${safeName(f.name)}.${extOf(f.path)}`, data); ok++; } }
  const lines = [`الاسم: ${w.full_name}`, `اللقب: ${w.laqab||'—'}`, `رقم البطاقة الوطنية: ${w.national_id||'—'}`, `عنوان السكن: ${w.address||'—'}`, `التحصيل الدراسي: ${w.education||'—'}`, `العنوان الوظيفي: ${w.job_title||'—'}`, `الجنسية: ${w.nationality||'—'}`, `تاريخ الميلاد: ${fmtDate(w.birth_date)}`, `القسم: ${w.department||'—'}`, '',
    ...docs.map(d => `${typeById(d.type_id)?.name||''}: ${d.doc_number||'—'} | الانتهاء: ${fmtDate(d.expiry_date)}`)];
  zip.file('معلومات العامل.txt', '\ufeff' + lines.join('\r\n'));
  downloadBlob(await zip.generateAsync({ type:'blob' }), safeName(w.full_name) + '.zip');
  toast(`تحمّل ${ok} ملف`);
}

/* نافذة رفع/تعديل مستمسك */
function docModal(w, doc, presetType, onSaved){
  const types = [...S.types].sort((a,b) => (typeApplies(b,w) - typeApplies(a,w)) || a.sort - b.sort);
  const cur = doc?.type_id ?? presetType ?? types[0]?.id;
  let keep = [...(doc?.files || [])], removed = [], pending = [];
  const m = openModal(doc ? 'تعديل مستمسك' : 'رفع مستمسك', `<form id="df"><div class="form-grid">
    <label class="field full">نوع المستمسك<select id="dt">${types.map(t => `<option value="${t.id}" ${t.id===cur?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>
    <label class="field" id="dxw">تاريخ الانتهاء<input id="dx" type="date" value="${esc(doc?.expiry_date||'')}"></label>
    <div class="field full">الملفات (صورة أو PDF، تكدرين ترفعين الوجه والظهر)
      <div class="thumbs" id="dfiles"></div>
      <div class="pick-btns" style="margin-top:8px">
        <label class="btn sm"><i class="ti ti-camera"></i> تصوير<input type="file" accept="image/*" capture="environment" hidden id="dcam"></label>
        <label class="btn sm"><i class="ti ti-paperclip"></i> اختيار ملفات<input type="file" accept="image/*,application/pdf" multiple hidden id="dpick"></label>
      </div></div>
    <label class="field full">ملاحظات<textarea id="dno">${esc(doc?.notes||'')}</textarea></label>
  </div><p class="err" id="derr"></p>
  <div class="row-end"><button type="button" class="btn" data-close>إلغاء</button><button class="btn primary" id="ds"><i class="ti ti-device-floppy"></i> حفظ</button></div></form>`);
  const syncExp = () => { const t = typeById(+$('#dt', m).value); $('#dxw', m).hidden = !t?.has_expiry; };
  const drawFiles = async () => {
    $('#dfiles', m).innerHTML = keep.map((f,i) => `<span class="thumb" data-file="${esc(f.path)}">${(f.mime||'').startsWith('image/')?'<img alt="">':'<i class="ti ti-file-type-pdf"></i>'}<button type="button" class="x" data-rk="${i}" aria-label="إزالة"><i class="ti ti-x"></i></button></span>`).join('')
      + pending.map((p,i) => `<span class="thumb">${p.url?`<img src="${p.url}" alt="">`:'<i class="ti ti-file-type-pdf"></i>'}<button type="button" class="x" data-rp="${i}" aria-label="إزالة"><i class="ti ti-x"></i></button></span>`).join('');
    $$('[data-rk]', m).forEach(b => b.onclick = () => { removed.push(keep[+b.dataset.rk]); keep.splice(+b.dataset.rk, 1); drawFiles(); });
    $$('[data-rp]', m).forEach(b => b.onclick = () => { pending.splice(+b.dataset.rp, 1); drawFiles(); });
    const urls = await signedUrls(keep.map(f => f.path));
    $$('#dfiles [data-file] img', m).forEach(im => { const u = urls[im.parentElement.dataset.file]; if(u) im.src = u; });
  };
  const addFiles = list => { [...list].forEach(f => pending.push({ file:f, url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null })); drawFiles(); };
  $('#dt', m).onchange = syncExp; $('#dcam', m).onchange = e => addFiles(e.target.files); $('#dpick', m).onchange = e => addFiles(e.target.files);
  syncExp(); drawFiles();
  $('#df', m).onsubmit = async e => { e.preventDefault(); $('#derr', m).textContent = '';
    const typeId = +$('#dt', m).value, t = typeById(typeId);
    if(!keep.length && !pending.length){ $('#derr', m).textContent = 'ارفعي ملف واحد على الأقل'; return; }
    if(t?.has_expiry && !$('#dx', m).value){ $('#derr', m).textContent = 'اكتبي تاريخ الانتهاء حتى ننبهج قبل ما يخلص'; return; }
    await busy($('#ds', m), async () => {
      const id = doc?.id || uuid(), uploaded = [];
      try{
        for(const [i, p] of pending.entries()){
          const r = await prepareFile(p.file);
          const path = `docs/${w.id}/${id}/${Date.now()}-${i}.${r.ext}`;
          await uploadBlob(path, r.blob, r.mime); uploaded.push({ path, name:p.file.name, mime:r.mime });
        }
        const row = { type_id:typeId, doc_number:doc?.doc_number ?? null, issue_date:doc?.issue_date ?? null, expiry_date: t?.has_expiry ? ($('#dx', m).value || null) : null, notes:val($('#dno', m)), files:[...keep, ...uploaded] };
        const q = doc ? sb.from('worker_documents').update(row).eq('id', id) : sb.from('worker_documents').insert({ ...row, id, worker_id:w.id });
        const { error } = await q; if(error) throw error;
      }catch(err){ await removeFiles(uploaded.map(u => u.path)); throw err; }
      await removeFiles(removed.map(f => f.path));
      pending.forEach(p => p.url && URL.revokeObjectURL(p.url));
      closeModal(); toast('انحفظ المستمسك'); await onSaved();
    });
  };
}

// حفظ المستمسكات من صفحة الإضافة/التعديل: يضيف الملفات الجديدة لمستمسك نفس النوع، ويشيل الملفات المحذوفة
async function saveDocUploads(wid, oldDocs, up){
  const toRemove = [];
  for(const [tid, st] of Object.entries(up)){
    const typeId = +tid, docs = oldDocs.filter(d => d.type_id === typeId).sort((a,b) => String(b.created_at).localeCompare(String(a.created_at)));
    docs.forEach(d => {
      const keep = new Set(st.keep.filter(k => k.docId === d.id).map(k => k.f.path)), all = d.files || [];
      d._files = all.filter(f => keep.has(f.path)); d._dirty = d._files.length !== all.length;
      toRemove.push(...all.filter(f => !keep.has(f.path)).map(f => f.path));
    });
    if(st.add.length){
      const target = docs[0], docId = target?.id || uuid(), uploaded = [];
      for(const [i, a] of st.add.entries()){
        const r = await prepareFile(a.file), path = `docs/${wid}/${docId}/${Date.now()}-${i}.${r.ext}`;
        await uploadBlob(path, r.blob, r.mime); uploaded.push({ path, name:a.file.name, mime:r.mime });
      }
      if(target){ target._files = [...target._files, ...uploaded]; target._dirty = true; }
      else { const { error } = await sb.from('worker_documents').insert({ id:docId, worker_id:wid, type_id:typeId, files:uploaded }); if(error) throw error; }
    }
    for(const d of docs){
      if(!d._dirty) continue;
      const q = d._files.length ? sb.from('worker_documents').update({ files:d._files }).eq('id', d.id) : sb.from('worker_documents').delete().eq('id', d.id);
      const { error } = await q; if(error) throw error;
    }
  }
  await removeFiles(toRemove);
}

function writeExcel(sheets, name){
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views:[{ RTL:true }] };
  sheets.forEach(([n, rows]) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'ملاحظة':'لا توجد بيانات' }]);
    ws['!cols'] = Object.keys(rows[0] || { a:1 }).map(k => ({ wch: Math.max(12, k.length + 4) })); XLSX.utils.book_append_sheet(wb, ws, n); });
  XLSX.writeFile(wb, name);
}
// يصدّر القائمة المعروضة (بعد البحث والفلاتر)، أو كل العمال إذا ما انطت قائمة

      else r[t.name] = d ? (d.doc_number || 'موجود') : (typeApplies(t,w) ? 'ناقص' : 'لا ينطبق'); });
    r['النواقص'] = i.missing.map(t => t.name).join('، ');
    return r;

  writeExcel([['العمال', rows]], `أرشيف العمال ${todayStr()}.xlsx`);

      <div id="types">${S.types.map(typeRow).join('')}</div>
      <div class="type-row"><input id="ntn" placeholder="اسم نوع جديد، مثلاً: إجازة السوق"><div class="type-opts"><button class="btn sm primary" id="ntb"><i class="ti ti-plus"></i> إضافة النوع</button></div></div></div>
    <div class="card section"><div class="section-head"><h2>المستخدمين والصلاحيات</h2></div>
      <p class="muted small" style="margin:0 0 8px">الموظفة تسوّي حسابها من صفحة الدخول (إنشاء حساب جديد)، ويطلع طلبها هنا. الموافقة تخليها محرّر وتكدر تضيف عمال.<br>مدير النظام: كلشي · محرّر: يضيف ويعدّل العمال والمستمسكات · مشاهد: يشوف الأسماء والصور فقط.</p>
      ${users.some(u => u.role === 'pending') ? `<p style="margin:0 0 6px;font-weight:700">طلبات جديدة</p>
      <div class="list" style="margin-bottom:14px">${users.filter(u => u.role === 'pending').map(u => `<div class="row" style="cursor:default"><span class="row-main"><b>${esc(u.full_name && u.full_name !== u.email ? u.full_name : (u.email||''))}</b><small><span dir="ltr">${esc(u.email||'')}</span> · ${fmtDate(String(u.created_at).slice(0,10))}</small></span>
        <button class="btn sm primary" data-approve="${u.id}"><i class="ti ti-check"></i> موافقة</button><button class="icon-btn danger-text" data-reject="${u.id}" aria-label="رفض"><i class="ti ti-x"></i></button></div>`).join('')}</div>` : ''}
      <div class="list">${users.filter(u => u.role !== 'pending').map(u => `<div class="row" style="cursor:default"><span class="row-main"><b>${esc(u.full_name || u.email)}</b><small dir="ltr" style="text-align:right">${esc(u.email||'')}</small></span>
        <select data-role="${u.id}" style="width:auto" ${u.id===S.user.id?'disabled':''} aria-label="الصلاحية">${Object.entries(ROLE_AR).map(([k,l]) => `<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div></div>`;
  }
  html += installCard();
  app.innerHTML = html;
  bindInstallCard();
  $('#th').onchange = e => { store('theme', e.target.value); applyTheme(); };
  $('#lo').onclick = () => sb.auth.signOut();
  if($('#xW')) $('#xW').onclick = exportWorkers;
  if(!isAdmin()) return;
  let newLogo = null;
  $('#lgf').onchange = e => { newLogo = e.target.files[0]; if(newLogo) $('#lgp').innerHTML = `<img src="${URL.createObjectURL(newLogo)}" alt="">`; };
  const saveSettings = async rows => { const { error } = await sb.from('app_settings').upsert(rows); if(error) throw error; };
  $('#osv').onclick = e => busy(e.currentTarget, async () => {
    const rows = [{ key:'org_name_ar', value:val($('#oar')) || '' }, { key:'org_name_en', value:val($('#oen')) || '' }];
    if(newLogo){ const r = await prepareFile(newLogo), path = `branding/logo-${Date.now()}.${r.ext}`;
      await uploadBlob(path, r.blob, r.mime); rows.push({ key:'logo_path', value:path }); if(S.settings.logo_path) await removeFiles([S.settings.logo_path]); }
    await saveSettings(rows); await loadAll(); toast('انحفظت الترويسة'); pageSettings();
  });
  if($('#lgr')) $('#lgr').onclick = e => busy(e.currentTarget, async () => {
    await removeFiles([S.settings.logo_path]); await saveSettings([{ key:'logo_path', value:'' }]); await loadAll(); toast('رجع الشعار الأصلي'); pageSettings();
  });
  $$('[data-approve]', app).forEach(b => b.onclick = () => busy(b, async () => {
    const { error } = await sb.from('profiles').update({ role:'editor' }).eq('id', b.dataset.approve); if(error) throw error;
    toast('تمت الموافقة، تكدر تدخل هسه'); pageSettings();
  }));
  $$('[data-reject]', app).forEach(b => b.onclick = async () => {
    if(!await confirmBox('ترفضين هذا الطلب؟', 'رفض')) return;
    await busy(b, async () => { const { error } = await sb.from('profiles').delete().eq('id', b.dataset.reject); if(error) throw error; toast('انرفض الطلب'); pageSettings(); });
  });
  $$('[data-role]', app).forEach(s => s.onchange = async () => {
    const { error } = await sb.from('profiles').update({ role:s.value }).eq('id', s.dataset.role);
    if(error) toast(errMsg(error), 'bad'); else toast('تغيّرت الصلاحية');
  });
  $$('[data-save-type]', app).forEach(b => b.onclick = () => busy(b, async () => {
    const r = b.closest('[data-tid]');
    const name = val($('.t-name', r)); if(!name) throw new Error('اكتبي اسم النوع');
    const { error } = await sb.from('document_types').update({ name, has_expiry:$('.t-exp', r).checked, required:$('.t-req', r).checked, applies_to:$('.t-app', r).value }).eq('id', +r.dataset.tid);
    if(error) throw error; await loadAll(); toast('انحفظ النوع');
  }));
  $$('[data-del-type]', app).forEach(b => b.onclick = async () => {
    const r = b.closest('[data-tid]'); if(!await confirmBox(`تحذفين نوع "${$('.t-name', r).value}"؟`)) return;
    await busy(b, async () => { const { error } = await sb.from('document_types').delete().eq('id', +r.dataset.tid); if(error) throw error; await loadAll(); toast('انحذف النوع'); pageSettings(); });
  });
  $('#ntb').onclick = e => busy(e.currentTarget, async () => {
    const name = val($('#ntn')); if(!name) throw new Error('اكتبي اسم النوع');
    const { error } = await sb.from('document_types').insert({ name, has_expiry:true, required:false, applies_to:'all', sort:(S.types.at(-1)?.sort || 0) + 1 });
    if(error) throw error; await loadAll(); toast('انضاف النوع'); pageSettings();
  });
}
function typeRow(t){
  return `<div class="type-row" data-tid="${t.id}"><input class="t-name" value="${esc(t.name)}" aria-label="اسم النوع">
  <div class="type-opts"><label class="chk"><input type="checkbox" class="t-exp" ${t.has_expiry?'checked':''}> له تاريخ انتهاء</label>
  <label class="chk"><input type="checkbox" class="t-req" ${t.required?'checked':''}> إجباري</label>
  <select class="t-app" aria-label="ينطبق على">${Object.entries(APPLIES_AR).map(([k,l]) => `<option value="${k}" ${t.applies_to===k?'selected':''}>${l}</option>`).join('')}</select>
  <button class="btn sm" data-save-type>حفظ</button><button class="icon-btn" data-del-type aria-label="حذف النوع"><i class="ti ti-trash"></i></button></div></div>`;
}

/* =====================================================================
   14.5) التثبيت على الموبايل كتطبيق
   ===================================================================== */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstallBar(); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#inst')?.remove(); toast('انثبّت التطبيق على الشاشة الرئيسية'); });
function showInstallBar(){
  $('#inst')?.remove();
  if(isStandalone() || store('instHide') === '1') return;
  if(!installEvt && !isIOS()) return;
  const bar = document.createElement('div'); bar.id = 'inst'; bar.className = 'inst' + ($('.nav') ? '' : ' no-nav');
  bar.innerHTML = `<img src="icon-192.png" alt=""><div style="flex:1;min-width:0"><b>ثبّت أرشفة على تلفونك</b><div class="muted small">يفتح مثل التطبيق من الشاشة الرئيسية</div></div>
    <button class="btn sm primary" id="instGo">تثبيت</button><button class="icon-btn" id="instX" aria-label="إغلاق" style="width:36px;height:36px"><i class="ti ti-x"></i></button>`;
  document.body.appendChild(bar);
  $('#instX').onclick = () => { store('instHide', '1'); bar.remove(); };
  $('#instGo').onclick = async () => {
    if(installEvt){ installEvt.prompt(); const r = await installEvt.userChoice; if(r.outcome === 'accepted') bar.remove(); installEvt = null; return; }
    openModal('التثبيت على الآيفون', `<ol style="margin:0;padding-inline-start:20px;line-height:2.2">
      <li>افتح الرابط من <b>Safari</b></li><li>اضغط زر المشاركة <i class="ti ti-share-2"></i> بالأسفل</li>
      <li>اختار <b>إضافة إلى الشاشة الرئيسية</b></li><li>اضغط <b>إضافة</b></li></ol><div class="row-end"><button class="btn primary" data-close>تمام</button></div>`);
  };
}
// زر التثبيت بالإعدادات حتى لو انسدّ الشريط
function installCard(){
  if(isStandalone()) return `<div class="card section"><div class="section-head"><h2>التطبيق</h2></div><p class="muted" style="margin:0">التطبيق مثبّت على هذا الجهاز.</p></div>`;
  return `<div class="card section"><div class="section-head"><h2>التطبيق</h2></div><p class="muted small" style="margin:0 0 10px">ثبّتي أرشفة على التلفون حتى تفتح من الشاشة الرئيسية مثل أي تطبيق.</p>
    <button class="btn" id="instNow"><i class="ti ti-device-mobile-down"></i> تثبيت على هذا الجهاز</button></div>`;
}
function bindInstallCard(){
  const b = $('#instNow'); if(!b) return;
  b.onclick = async () => {
    store('instHide', '0');
    if(installEvt){ installEvt.prompt(); await installEvt.userChoice; installEvt = null; return; }
    if(isIOS()){ showInstallBar(); $('#instGo')?.click(); return; }
    openModal('التثبيت', `<p style="margin:0">من Chrome اضغطي النقاط الثلاث <b>⋮</b> فوق، واختاري <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>.</p><div class="row-end"><button class="btn primary" data-close>تمام</button></div>`);
  };
}

/* =====================================================================
   15) التشغيل
   ===================================================================== */
(async function boot(){
  if(!CONFIGURED){ renderSetup(); return; }
  sb.auth.onAuthStateChange((ev) => {
    if(ev === 'PASSWORD_RECOVERY') renderNewPassword();
    if(ev === 'SIGNED_OUT'){ S.user = null; S.profile = null; S.loaded = false; S.urls.clear(); S.f = { ...F0 }; location.hash = ''; renderLogin(); }
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(IS_RECOVERY){ renderNewPassword(); return; }
  if(!location.hash.startsWith('#/')) history.replaceState(null, '', location.pathname + '#/home');
  if(session) await afterLogin(session.user); else renderLogin();
})();
</script>
</body>
